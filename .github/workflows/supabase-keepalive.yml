name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 00:00 UTC
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña "Actions" cuando quieras probarlo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"